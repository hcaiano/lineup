name: Deploy website

# Dormant automatic-deploy workflow for the Cloudflare Worker that serves web/. The job runs only
# when the repository variable ENABLE_WEB_DEPLOY is set to "true".
on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

# One deploy at a time; cancel an in-flight run when a newer commit lands.
concurrency:
  group: deploy-web
  cancel-in-progress: true

jobs:
  deploy:
    # The variable is unset by default, so website publishes stay maintainer-controlled.
    if: ${{ vars.ENABLE_WEB_DEPLOY == 'true' }}
    runs-on: ubuntu-latest
    name: Deploy to Cloudflare
    steps:
      - uses: actions/checkout@v4
      - name: Deploy with Wrangler
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: web
          command: deploy
